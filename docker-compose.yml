# ============================================================
# TAWASUL — Docker Compose (Production)
# Port: 4030 → Cloudflare Tunnel → tawasul.grade.sbs
# ============================================================

services:
  tawasul-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tawasul-app
    restart: unless-stopped
    ports:
      - "4030:4030"
    volumes:
      # Persist storage (uploads, logs)
      - tawasul-storage:/var/www/html/storage
      # Persist SQLite database
      - tawasul-database:/var/www/html/database
    environment:
      - APP_NAME=TAWASUL
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=https://tawasul.grade.sbs
      - APP_LOCALE=ar
      - LOG_CHANNEL=stack
      - LOG_LEVEL=error
      - DB_CONNECTION=sqlite
      - SESSION_DRIVER=database
      - QUEUE_CONNECTION=database
      - CACHE_STORE=database
      - SAR_TO_JOD=0.19
    env_file:
      - .env.production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4030/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  tawasul-storage:
    driver: local
  tawasul-database:
    driver: local
